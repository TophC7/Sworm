name: Linux release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      hash: ${{ steps.version.outputs.hash }}
      package: ${{ steps.version.outputs.package }}
    steps:
      - name: Derive version from this push
        id: version
        run: |
          hash="${GITHUB_SHA:0:12}"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "package=0.0.$GITHUB_RUN_NUMBER+$hash" >> "$GITHUB_OUTPUT"

  test:
    name: Test workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Run workspace tests
        run: nix develop --command cargo test --workspace -- --quiet

  deb:
    name: Debian (${{ matrix.arch }})
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            system: x86_64-linux
            runner: ubuntu-24.04
          - arch: arm64
            system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      APP_VERSION: ${{ needs.version.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Build packages with Nix
        run: |
          mkdir -p dist
          nix build \
            .#packages.${{ matrix.system }}.deb \
            .#packages.${{ matrix.system }}.server-deb \
            .#packages.${{ matrix.system }}.server-tarball \
            --impure --out-link result
          cp -L result*/*.deb result*/*.tar.gz dist/
      - name: Install and smoke test packages on runner
        run: |
          sudo apt-get update && sudo apt-get install --yes xvfb xdotool dbus-x11 desktop-file-utils
          sudo dpkg -i dist/sworm_*.deb dist/sworm-server_*.deb
          desktop-file-validate /usr/share/applications/sworm.desktop
          dbus-run-session -- xvfb-run -a sh nix/packaging/smoke.sh
          sworm-server --help
          sworm-server fingerprint --help
          # Smoke test standalone tarball
          mkdir -p test-tarball
          tar -xzf dist/sworm-server-*.tar.gz -C test-tarball
          test-tarball/*/bin/sworm-server --help
          test-tarball/*/bin/sworm-server fingerprint --help
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Assemble and release
    needs: [version, deb]
    runs-on: ubuntu-24.04
    concurrency:
      group: github-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.version.outputs.package }}
      COMMIT_HASH: ${{ needs.version.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Generate checksum-pinned AUR recipe
        run: nix run .#generate-aur -- "$APP_VERSION" dist
      - name: Compute checksums
        run: |
          cd dist
          sha256sum *.deb *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest_flag="--latest=false"
          current_latest="$(gh release view --json targetCommitish,tagName --jq '.targetCommitish // .tagName' 2>/dev/null || true)"
          git fetch origin main --depth=1
          tip_sha="$(git rev-parse origin/main)"
          if test -z "$current_latest" || git merge-base --is-ancestor "$current_latest" "$GITHUB_SHA" || test "$GITHUB_SHA" = "$tip_sha"; then
            latest_flag="--latest=true"
          fi
          gh release create "$COMMIT_HASH" --target "$GITHUB_SHA" \
            "$latest_flag" \
            --title "$COMMIT_HASH" --generate-notes \
            dist/*.deb dist/*.tar.gz dist/SHA256SUMS
