[package]
name = "sworm"
version = "0.0.0"
edition = "2021"
description = "Sworm - Linux-first desktop app for coding-agent CLIs"
license = "AGPL-3.0-or-later"

[lib]
name = "sworm_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "sworm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sworm-core = { path = "../src-crates/sworm-core" }
sworm-protocol = { path = "../src-crates/sworm-protocol" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
rusqlite.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot.workspace = true
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-single-instance = "2"
wl-clipboard-rs = "0.9.3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
jsonc-parser.workspace = true
